name: Publish Studio Amir
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify website archive
        run: |
          echo "13f17d69ae253d963058530b88dabe3cd241cc237547211d940490e59307325e  latest-source.zip" | sha256sum --check
          node restore.mjs
          unzip -q studio-amir-site.zip
          unzip -qo latest-source.zip
          echo "a9d45653d266caf26e5ea8da2d9f09b6bb6ccf3358d513d13d5a0c86b6ffe1eb  projects-update-2026-09-18.zip" | sha256sum --check
          unzip -qo projects-update-2026-09-18.zip
          sed -i 's|https://t.me/libertarian_75|https://t.me/Architect_Book|g' studio-amir-site/content/profile.json
      - name: Build and validate
        working-directory: studio-amir-site
        run: |
          node scripts/build.mjs
          node scripts/check.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio-amir-site/docs
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
